; ============================================================
; REGULUS PlatformIO Configuration
; ESP32-S3-WROOM-1 N16R8
; ============================================================

; ------------------------------------------------------------
; Common settings
; ------------------------------------------------------------

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; ESP32-S3 Native USB CDC
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3-WROOM-1 N16R8
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv


; ============================================================
; Main firmware
; ============================================================

[env:firmware]

build_src_filter =
    +<firmware/>
    +<tasks/>
    +<drivers/>
    +<CanSatData.cpp>
    -<bringup/>


; ============================================================
; I2C bus scanner
; ============================================================

[env:i2c_scan]

build_src_filter =
    +<bringup/i2c_scan.cpp>


; ============================================================
; GNSS UART test
; ============================================================

[env:gnss_test]

build_src_filter =
    +<bringup/gnss_test.cpp>


; ============================================================
; Motor driver test
; ============================================================

[env:motor_test]

build_src_filter =
    +<bringup/motor_test.cpp>