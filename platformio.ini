; ============================================================
; REGULUS PlatformIO Configuration
; ESP32-S3-WROOM-1 N16R8
; ============================================================

; ------------------------------------------------------------
; Common settings
; ------------------------------------------------------------

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; ESP32-S3 Native USB CDC
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3-WROOM-1 N16R8
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv


; ============================================================
; Main firmware
; ============================================================

[env:firmware]

build_src_filter =
    +<firmware/>
    +<tasks/>
    +<drivers/>
    +<CanSatData.cpp>
    +<MissionState.cpp>
    -<bringup/>


; ============================================================
; I2C bus scanner
; ============================================================

[env:i2c_scan]

build_src_filter =
    +<bringup/i2c_scan.cpp>


; ============================================================
; GNSS UART test
; ============================================================

[env:gnss_test]

build_src_filter =
    +<bringup/gnss_test.cpp>
    +<drivers/MAX-M10M.cpp>


; ============================================================
; Motor driver test
; ============================================================

[env:motor_test]

build_src_filter =
    +<bringup/motor_test.cpp>

; ============================================================
; Magnetometer test
; ============================================================

[env:mag_test]
build_src_filter =
    +<bringup/mag_test.cpp>
    +<drivers/MMC5603.cpp>

; ============================================================
; IMU test
; ============================================================

[env:imu_test]
build_src_filter =
    +<bringup/imu_test.cpp>
    +<drivers/QMI8658.cpp>

; ============================================================
; Barometer test
; ============================================================

[env:baro_test]
build_src_filter =
    +<bringup/baro_test.cpp>
    +<drivers/HP203B.cpp>

[env:baremetal]
build_src_filter =
    +<baremetal/>
    +<drivers/>
    +<CanSatData.cpp>

[env:baremetal_espnow]
build_unflags =
    -std=gnu++11
build_src_filter =
    +<baremetal/>
    +<drivers/>
    +<communication/>
    +<CanSatData.cpp>
build_flags =
    ${env.build_flags}
    -D ENABLE_ESPNOW=1
    -std=gnu++14

[env:freertos_sensors]
build_src_filter =
    +<firmware/>
    +<tasks/>
    +<drivers/>
    +<CanSatData.cpp>
    +<MissionState.cpp>

[env:freertos_flight]
build_unflags =
    -std=gnu++11
build_src_filter =
    +<firmware/>
    +<tasks/>
    +<drivers/>
    +<communication/>
    +<CanSatData.cpp>
    +<MissionState.cpp>
build_flags =
    ${env.build_flags}
    -D ENABLE_AUTOMATIC_FLIGHT_PHASES=1
    -D ENABLE_ESPNOW=1
    -std=gnu++14

[env:freertos_flight_mock]
build_unflags =
    -std=gnu++11
build_src_filter =
    +<firmware/>
    +<tasks/>
    +<communication/>
    +<CanSatData.cpp>
    +<MissionState.cpp>
build_flags =
    ${env.build_flags}
    -D USE_MOCK_SENSORS=1
    -D ENABLE_ESPNOW=1
    -std=gnu++14
